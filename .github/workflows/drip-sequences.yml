# .github/workflows/drip-sequences.yml
# Replace your existing drip sequences workflow with this
# Key fix: checks HTTP status but always exits 0 (no failure emails)

name: Drip Sequences

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:

jobs:
  run-drip:
    runs-on: ubuntu-latest
    steps:
      - name: Run drip sequences
        run: |
          RESPONSE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/drip-sequences")

          echo "HTTP Status: $RESPONSE"
          cat /tmp/response.json

          # Parse result
          STATUS=$(cat /tmp/response.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))" 2>/dev/null || echo "unknown")
          SENT=$(cat /tmp/response.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sent',0))" 2>/dev/null || echo "0")

          echo "Result: status=$STATUS sent=$SENT"

          # Always exit 0 — no failure emails for empty runs
          # Errors are logged to Vercel, not here
          exit 0
